# Snippet inside the top-level `stream {}` block of /etc/nginx/nginx.conf
# (nginx does not allow `stream{}` inside sites-available/conf.d — it must be
# a top-level context alongside `http{}`, so this is included/pasted there
# directly rather than via an include file).
#
# Multiplexes port 443: real HTTPS (TLS ClientHello present) goes to the
# normal web vhosts on 127.0.0.1:18443; anything without a TLS ClientHello
# (the raw Minecraft protocol) goes to the PROXY-protocol relay in front of
# Paper. This is how the Minecraft port is disguised behind normal website
# traffic on the same port 443, since the VPS provider blocks port 25565
# and bans standalone game servers.
#
# Requires: apt-get install libnginx-mod-stream
# (nginx -V may list --with-stream=dynamic without the module actually
#  being installed/loaded — check for this if the stream block doesn't work)

stream {
	map $ssl_preread_protocol $mc_backend {
		default 127.0.0.1:18443;
		""      127.0.0.1:25567;
	}

	server {
		listen 443;
		listen [::]:443;
		proxy_pass $mc_backend;
		proxy_protocol on;
		ssl_preread on;
	}
}
