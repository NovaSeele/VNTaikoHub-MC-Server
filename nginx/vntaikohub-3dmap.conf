# Web viewer cho plugin BlueMap (bản đồ 3D). Subdomain riêng, cùng lý do
# với vntaikohub-map.conf (squaremap) — asset JS/CSS tham chiếu tuyệt đối
# từ root.
#
# BlueMap 5.23 không có setting đổi bind IP như squaremap (luôn bind
# 0.0.0.0:8100) — chấp nhận được vì ufw mặc định DROP, chỉ mở 22/80/443,
# nên port 8100 không lộ ra ngoài. Xem README mục "Bản đồ 3D".
#
# proxy_http_version 1.1 + Connection "" vì BlueMap dùng Server-Sent Events
# (SSE) để đẩy update tile/marker live — nginx mặc định proxy theo kiểu
# HTTP/1.0 sẽ cắt connection giữa chừng.

server {
    listen 80;
    listen [::]:80;
    server_name vntaikohub-3dmap.novaseele.com;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:18443 ssl http2 proxy_protocol;
    server_name vntaikohub-3dmap.novaseele.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
