# Web viewer cho plugin squaremap. Đặt riêng subdomain thay vì gắn subpath
# vào vhost dashboard, vì JS/CSS của squaremap tham chiếu asset theo đường
# dẫn tuyệt đối từ root — gắn subpath sẽ vỡ đường dẫn asset.
#
# squaremap's internal webserver phải bind 127.0.0.1 (không phải 0.0.0.0)
# trong plugins/squaremap/config.yml — xem README mục "Bản đồ live".

server {
    listen 80;
    listen [::]:80;
    server_name vntaikohub-map.novaseele.com;
    return 301 https://$host$request_uri;
}

server {
    listen 127.0.0.1:18443 ssl http2 proxy_protocol;
    server_name vntaikohub-map.novaseele.com;

    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
